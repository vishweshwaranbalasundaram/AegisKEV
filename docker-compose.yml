services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegiskev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegiskev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegiskev
      AEGIS_BUNDLE_PATH: /app/artifacts/champion/champion_bundle.joblib
      AEGIS_METRICS_PATH: /app/artifacts/champion/metrics_summary.json
      AEGIS_CORS_ORIGINS: http://localhost:3000
      AEGIS_SQLITE_PATH: /app/data/prediction_logs.sqlite3
      AEGIS_JSONL_PATH: /app/data/prediction_logs.jsonl
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

volumes:
  postgres_data:
  api_data:
  mlflow_data:
