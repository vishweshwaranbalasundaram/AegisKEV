[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiskev"
version = "0.1.0"
description = "Time-aware 180-day CISA KEV exploitation forecasting system"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "optuna==5.1.0",
    "shap==0.54.1",
    "mlflow==3.18.0",
    "evidently==0.7.23",
    "torch>=2.3.0",
    "scipy>=1.13.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    "requests>=2.32.0",
    "joblib>=1.4.0",
    "tqdm>=4.66.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["ml*", "backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ml/tests"]
addopts = "-ra"
